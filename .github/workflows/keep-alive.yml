name: Keep Streamlit Alive

on:
  schedule:
    - cron: '*/30 * * * *'  # 30分ごとに実行
  workflow_dispatch:        # GitHubの画面から手動でも実行できるようにする

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          python3 -c "
          import urllib.request
          # ↓ ご自身のStreamlit CloudのURLに書き換えてください
          url = 'https://uranai123.streamlit.app/'
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'})
              with urllib.request.urlopen(req) as response:
                  print(f'Success! Status code: {response.status}')
          except Exception as e:
              print(f'Failed to ping: {e}')
          "